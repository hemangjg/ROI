name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: bufbuild/buf-setup-action@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: |
          pnpm install --frozen-lockfile
          go work sync
      # packages/proto/gen is gitignored — must exist before golangci-lint / go test
      - name: Generate protos
        run: pnpm proto:generate
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - run: bash scripts/lint-go.sh

  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @ai-finops/web lint

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:lint
      - run: pnpm proto:generate
      - name: Verify generated proto compiles
        run: |
          cd packages/proto
          go test ./...
          go build ./...
          cd ../..
          pnpm exec tsc -p packages/proto/tsconfig.json --noEmit
      - name: Buf breaking (PRs with main baseline)
        if: github.event_name == 'pull_request'
        working-directory: contracts/proto
        run: |
          if git ls-remote --exit-code origin main >/dev/null 2>&1; then
            buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
          else
            echo "Skipping buf breaking — origin/main not available yet"
          fi

  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
      - name: Atlas migrate hash
        working-directory: db/atlas
        run: atlas migrate hash

  sqlc:
    name: SQLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.28.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm sqlc:generate
      - name: Check SQLC drift
        run: |
          git diff --exit-code db/atlas/sql || (
            echo "SQLC generated code is stale. Run pnpm sqlc:generate."
            exit 1
          )

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - run: pnpm install --frozen-lockfile
      - run: go work sync
      - name: Generate protos
        run: pnpm proto:generate
      - run: pnpm test:go
      - run: bash scripts/test-services.sh
      - run: pnpm exec nx run-many -t test --projects=web,sdk-core,sdk-typescript

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-go, lint-ts, proto, test]
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - run: pnpm install --frozen-lockfile
      - run: go work sync
      - run: pnpm proto:generate
      - run: pnpm exec nx run-many -t build --exclude=web,workspace
      - run: bash scripts/build-web.sh

  build-web-image:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build web
        run: docker build -f apps/web/Dockerfile .
