name: ai-finops

x-postgres-url: &postgres-url postgres://finops:finops@postgres:5432/finops?sslmode=disable
x-openfga-url: &openfga-url postgres://finops:finops@postgres:5432/openfga?sslmode=disable
x-otlp-endpoint: &otlp-endpoint ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core, services, web, full]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finops"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:24
    profiles: [core, services, web, full]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infra/docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    image: redis:7-alpine
    profiles: [core, services, web, full]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: apache/kafka:3.9.0
    profiles: [core, services, web, full]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  temporal:
    image: temporalio/auto-setup:1.25.0
    profiles: [core, services, web, full]
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: finops
      POSTGRES_PWD: finops
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  openfga-migrate:
    image: openfga/openfga:latest
    profiles: [core, services, web, full]
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: *openfga-url
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    profiles: [core, services, web, full]
    command: run
    ports:
      - "8090:8080"
      - "8091:8081"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: *openfga-url
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./secrets/jwt:/app/secrets/jwt:ro
    environment:
      IDENTITY_SERVICE_ENVIRONMENT: local
      IDENTITY_SERVICE_LOG_LEVEL: info
      IDENTITY_SERVICE_HTTP_PORT: 8080
      IDENTITY_SERVICE_GRPC_PORT: 9090
      IDENTITY_SERVICE_DATABASE_URL: *postgres-url
      IDENTITY_SERVICE_REDIS_URL: redis://redis:6379
      IDENTITY_SERVICE_OTLP_ENDPOINT: *otlp-endpoint
      IDENTITY_SERVICE_JWT_PRIVATE_KEY_PATH: /app/secrets/jwt/private.pem
      IDENTITY_SERVICE_JWT_PUBLIC_KEY_PATH: /app/secrets/jwt/public.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8081:8081"
      - "9093:9093"
    environment:
      INGESTION_SERVICE_ENVIRONMENT: local
      INGESTION_SERVICE_LOG_LEVEL: info
      INGESTION_SERVICE_HTTP_PORT: 8081
      INGESTION_SERVICE_GRPC_PORT: 9093
      INGESTION_SERVICE_RATE_LIMIT_PER_MINUTE: 1000
      INGESTION_SERVICE_DATABASE_URL: *postgres-url
      INGESTION_SERVICE_REDIS_URL: redis://redis:6379
      INGESTION_SERVICE_OTLP_ENDPOINT: *otlp-endpoint
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  management-service:
    build:
      context: .
      dockerfile: services/management-service/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8082:8082"
      - "9091:9091"
    environment:
      MANAGEMENT_SERVICE_ENVIRONMENT: local
      MANAGEMENT_SERVICE_LOG_LEVEL: info
      MANAGEMENT_SERVICE_HTTP_PORT: 8082
      MANAGEMENT_SERVICE_GRPC_PORT: 9091
      MANAGEMENT_SERVICE_DATABASE_URL: *postgres-url
      MANAGEMENT_SERVICE_REDIS_URL: redis://redis:6379
      MANAGEMENT_SERVICE_OTLP_ENDPOINT: *otlp-endpoint
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8083:8083"
      - "9095:9095"
    environment:
      ANALYTICS_SERVICE_ENVIRONMENT: local
      ANALYTICS_SERVICE_LOG_LEVEL: info
      ANALYTICS_SERVICE_HTTP_PORT: 8083
      ANALYTICS_SERVICE_GRPC_PORT: 9095
      ANALYTICS_SERVICE_DATABASE_URL: *postgres-url
      ANALYTICS_SERVICE_CLICKHOUSE_URL: clickhouse://clickhouse:9000/finops
      ANALYTICS_SERVICE_REDIS_URL: redis://redis:6379
      ANALYTICS_SERVICE_OTLP_ENDPOINT: *otlp-endpoint
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      openfga:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8084:8084"
    environment:
      PRICING_SERVICE_ENVIRONMENT: local
      PRICING_SERVICE_LOG_LEVEL: info
      PRICING_SERVICE_HTTP_PORT: 8084
      PRICING_SERVICE_GRPC_PORT: 9092
      PRICING_SERVICE_DATABASE_URL: *postgres-url
      PRICING_SERVICE_OTLP_ENDPOINT: *otlp-endpoint
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  outbox-relay:
    build:
      context: .
      dockerfile: services/outbox-relay/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8086:8086"
    environment:
      OUTBOX_RELAY_ENVIRONMENT: local
      OUTBOX_RELAY_LOG_LEVEL: info
      OUTBOX_RELAY_HTTP_PORT: 8086
      OUTBOX_RELAY_DATABASE_URL: *postgres-url
      OUTBOX_RELAY_KAFKA_BROKERS: kafka:9092
      OUTBOX_RELAY_KAFKA_TOPIC: usage.events.raw
      OUTBOX_RELAY_POLL_INTERVAL: 100ms
      OUTBOX_RELAY_BATCH_SIZE: 500
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    profiles: [services, web, full]
    ports:
      - "8085:8085"
      - "9094:9094"
    environment:
      WORKFLOW_SERVICE_ENVIRONMENT: local
      WORKFLOW_SERVICE_LOG_LEVEL: info
      WORKFLOW_SERVICE_HTTP_PORT: 8085
      WORKFLOW_SERVICE_GRPC_PORT: 9094
      WORKFLOW_SERVICE_DATABASE_URL: *postgres-url
      WORKFLOW_SERVICE_OTLP_ENDPOINT: *otlp-endpoint
      WORKFLOW_SERVICE_KAFKA_BROKERS: kafka:9092
      WORKFLOW_SERVICE_KAFKA_TOPIC: usage.events.raw
      WORKFLOW_SERVICE_KAFKA_GROUP_ID: workflow-service
      WORKFLOW_SERVICE_PRICING_GRPC_ADDR: pricing-service:9092
      WORKFLOW_SERVICE_CLICKHOUSE_URL: clickhouse://clickhouse:9000/finops
      WORKFLOW_SERVICE_IDEMPOTENCY_TTL_HOURS: 2160
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_started
      clickhouse:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  envoy:
    image: envoyproxy/envoy:v1.31.2
    profiles: [services, web, full]
    ports:
      - "8888:8888"
      - "8443:8443"
      - "8444:8444"
      - "127.0.0.1:9901:9901"
    volumes:
      - ./infra/docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./secrets/certs:/etc/envoy/certs:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      identity-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      management-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8888/v1
        NEXT_PUBLIC_USE_MOCK_API: "false"
    profiles: [web, full]
    ports:
      - "3000:3000"
    depends_on:
      identity-service:
        condition: service_healthy
      envoy:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: [obs, full]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki:2.9.0
    profiles: [obs, full]
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.54.0
    profiles: [obs, full]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [obs, full]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    deploy:
      resources:
        limits:
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [obs, full]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  chdata:
  kafkadata:
  lokidata:
