syntax = "proto3";

package analytics.v1;

option go_package = "github.com/ai-finops/api/gen/go/analytics/v1;analyticsv1";

import "google/protobuf/timestamp.proto";

message SpendSummaryRequest {
  string org_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string team_id = 4;
}

message SpendSummaryResponse {
  string today_usd = 1;
  string mtd_usd = 2;
  string previous_period_usd = 3;
  double change_pct = 4;
}

message TimeSeriesPoint {
  string date = 1;
  string cost_usd = 2;
}

message SpendTimeSeriesRequest {
  string org_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string granularity = 4;
  string team_id = 5;
}

message SpendTimeSeriesResponse {
  repeated TimeSeriesPoint data = 1;
}

service AnalyticsService {
  rpc GetSpendSummary(SpendSummaryRequest) returns (SpendSummaryResponse);
  rpc GetSpendTimeSeries(SpendTimeSeriesRequest) returns (SpendTimeSeriesResponse);
}